config-info:
  language: "vi"
  purpose: "Cấu hình bảo mật, Discord, kiểm toán lệnh và quyền riêng tư cho AP-StaffGuard."
  sensitive-data: "discord.bot-token và server-secret.value là dữ liệu bí mật; không chia sẻ hoặc commit công khai."
  list-format: "Mỗi mục dạng danh sách dùng một dòng bắt đầu bằng dấu gạch ngang. Giữ mục trống là - \"\" nếu chưa có giá trị."

security:
  enabled: true
  temporary-ban-duration: "5m"
  verification-timeout: "2m"
  max-trusted-ips-per-account: 10
  max-verification-requests-per-10-minutes: 3
  max-verification-requests-per-ip-per-10-minutes: 5
  max-pending-sessions: 100
  max-discord-interactions-per-minute: 30
  max-discord-accounts-per-user: 2
  token-bytes: 32
  max-verification-notifications: 3
  verification-notification-cooldown: "30s"
  audit-retention-days: 30
  mask-ip-in-discord: true

privacy:
  enabled: true
  suppress-protected-join-message: true
  redact-ip-in-command-audit: true
  redact-coordinates-in-command-audit: true

discord:
  enabled: false
  channel-id: ""
  bot-token: ""
  owner-user-ids:
    - ""
  staff-user-ids:
    - ""
  send-dm: true
  allow-self-approval: false
  embeds:
    verification:
      title: "🔐 AP-STAFFGUARD • Xác thực đăng nhập"
      color: "#F5A623"
      description: "Phát hiện đăng nhập từ IP chưa được tin cậy. Hãy kiểm tra thông tin bên dưới trước khi xác nhận."
      minecraft-field: "👤 Minecraft"
      role-field: "🛡️ Role"
      ip-field: "🌐 IP"
      verification-field: "🆔 Verification"
      expiry-field: "⏱️ Hết hạn"
      server-field: "🏠 Server"
      footer: "AP-StaffGuard • Owner có thể xác nhận mọi request; Staff chỉ xác nhận request của chính mình."
      approve-button: "✅ Xác nhận"
      deny-button: "❌ Từ chối"
    command-audit:
      title: "🛡️ AP-StaffGuard • Admin Command Audit"
      safe-color: "#3498DB"
      danger-color: "#E74C3C"
      description: "Ghi nhận thao tác command của admin/operator trên server."
      command-field: "💻 Command"
      sender-field: "👤 Người thực hiện"
      permission-field: "🔐 Quyền"
      server-field: "🏠 Server"
      channel-field: "📍 Nguồn"
      footer: "AP-StaffGuard • Command audit"
  command-audit:
    enabled: false
    channel-id: ""
    log-admin-commands: true
    log-op-commands: true
    log-console-commands: true
    redact-sensitive-arguments: true
    dangerous-commands:
      - "op"
      - "deop"
      - "ban"
      - "ban-ip"
      - "pardon"
      - "pardon-ip"
      - "kick"
      - "whitelist"
      - "stop"
      - "restart"
      - "reload"
      - "execute"
      - "tp"
      - "teleport"
      - "give"
      - "gamemode"
      - "setworldspawn"
      - "locate"
      - "summon"

server:
  display-name: "Minecraft Server"

database:
  type: "sqlite"
  file: "staffguard.db"

server-secret:
  # Bắt buộc: 256-bit secret persistent. Dùng 64 hex chars hoặc base64/base64url của đúng 32 bytes. Không để trống.
  value: ""

proxy:
  mode: "NONE"
  require-trusted-proxy: true
  trusted-proxy-addresses:
    - ""

messages:
  different-ip: "§cTài khoản đang đăng nhập từ IP chưa được tin cậy. §fVui lòng xác minh qua Discord rồi đăng nhập lại."
  lockdown: "§cStaffGuard đang ở chế độ LOCKDOWN. §fVui lòng liên hệ quản trị viên."
  security-unavailable: "§cBảo mật StaffGuard chưa sẵn sàng. §fVui lòng liên hệ quản trị viên."
  prefix: "§8[§bAP-StaffGuard§8] §r"
  no-permission: "§cBạn không có quyền thực hiện thao tác này."
  player-only: "§cThao tác này yêu cầu player."
  operation-failed: "§cThao tác thất bại. Kiểm tra console để biết chi tiết."
  not-found: "§cKhông tìm thấy protected account."
  invalid-role: "§cRole phải là OWNER hoặc STAFF."
  invalid-discord-id: "§cDiscord User ID không hợp lệ."
  usage: "§e/staffguard help"
